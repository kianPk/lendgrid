<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LendGrid</title>
<link rel="stylesheet" href="./style.css"/>
</head><body>
<div class="shell">
<header class="top"><div class="brand"><h1>LendGrid</h1><p>Solidity · Foundry · lab demo</p></div><span class="chip" id="net">demo mode</span></header>
<section class="hero"><p class="kicker">Overcollateralized lending</p><h2>Collateral in. Debt out. Liquidate when the health factor cracks.</h2></section>
<section class="kpis" id="kpis"></section>
<div class="layout">
<aside class="panel"><h3>Position</h3>
<label>Collateral WETH<input id="coll" type="number" value="10" step="0.1"/></label>
<label>Borrow USDC<input id="bor" type="number" value="15000"/></label>
<label>ETH price ($)<input id="px" type="number" value="3000"/></label>
<div id="actions"></div></aside>
<section class="panel"><h3>Event log</h3><pre class="log" id="log"></pre></section>
</div>
<footer><span>kianPk / lendgrid</span><a href="https://github.com/kianPk/lendgrid" target="_blank" rel="noopener">source</a></footer>
</div>
<script src="./app.js"></script>
</body></html>
